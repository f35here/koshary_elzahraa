      // ─── GLOBAL ORDER TYPE ──────────────────────────────────────────────

      let orderType = null; // 'delivery' or 'dinein'

      // ─── STORAGE ────────────────────────────────────────────────────────

      const Storage = {
        get(key, fallback) {
          try {
            const data = localStorage.getItem(key);
            return data ? JSON.parse(data) : fallback;
          } catch {
            return fallback;
          }
        },
        set(key, value) {
          try {
            localStorage.setItem(key, JSON.stringify(value));
          } catch (e) {
            console.warn("Storage set error:", e);
          }
        },
        remove(key) {
          localStorage.removeItem(key);
        },
      };

      // ─── CART ───────────────────────────────────────────────────────────

      const Cart = {
        key: "koshary_cart",
        data: [],
        init() {
          this.data = Storage.get(this.key, []);
          return this;
        },
        save() {
          Storage.set(this.key, this.data);
          return this;
        },
        getItems() {
          return this.data;
        },
        getTotalItems() {
          return this.data.reduce((sum, item) => sum + item.quantity, 0);
        },
        getTotalPrice() {
          return this.data.reduce(
            (sum, item) => sum + item.price * item.quantity,
            0,
          );
        },
        addItem(menuItem, variationIndex) {
          const variation = menuItem.variations[variationIndex];
          const fullName = `${menuItem.name} (${variation.label})`;
          const id = `${menuItem.id}-${variation.label}`;
          const existing = this.data.find((item) => item.id === id);
          if (existing) {
            existing.quantity += 1;
          } else {
            this.data.push({
              id,
              name: fullName,
              price: variation.price,
              image: menuItem.image,
              quantity: 1,
            });
          }
          this.save();
          return this;
        },
        removeItem(id) {
          this.data = this.data.filter((item) => item.id !== id);
          this.save();
          return this;
        },
        updateQuantity(id, delta) {
          const item = this.data.find((i) => i.id === id);
          if (!item) return this;
          const newQty = item.quantity + delta;
          if (newQty <= 0) {
            return this.removeItem(id);
          }
          item.quantity = newQty;
          this.save();
          return this;
        },
        clear() {
          this.data = [];
          this.save();
          return this;
        },
        getItem(id) {
          return this.data.find((item) => item.id === id);
        },
      };

      // ─── UI HELPERS ────────────────────────────────────────────────────

      const UI = {
        formatPrice(amount) {
          return `${amount} ج.م`;
        },
        throttleRAF(fn) {
          let ticking = false;
          return (...args) => {
            if (!ticking) {
              requestAnimationFrame(() => {
                fn(...args);
                ticking = false;
              });
              ticking = true;
            }
          };
        },
      };

      // ─── LAZY LOADER ────────────────────────────────────────────────────

      const LazyLoader = {
        observer: null,
        initialized: false,
        init() {
          if (this.initialized) return;
          this.observer = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  const img = entry.target;
                  const src = img.dataset.src;
                  if (src) {
                    img.src = src;
                    img.onload = () => {
                      img.classList.add("loaded");
                      const placeholder = img.parentElement.querySelector(
                        ".menu-card-image-placeholder",
                      );
                      if (placeholder) placeholder.classList.add("hidden");
                    };
                    img.onerror = () => {
                      img.classList.add("error");
                      img.alt = "صورة غير متوفرة";
                      const placeholder = img.parentElement.querySelector(
                        ".menu-card-image-placeholder",
                      );
                      if (placeholder) placeholder.classList.add("hidden");
                    };
                    img.removeAttribute("data-src");
                  }
                  this.observer.unobserve(img);
                }
              });
            },
            { rootMargin: "150px 0px", threshold: 0.01 },
          );
          this.initialized = true;
        },
        observeAll(images) {
          if (!this.initialized) this.init();
          images.forEach((img) => {
            if (img.dataset.src) {
              this.observer.observe(img);
            }
          });
        },
      };

      // ─── MENU ───────────────────────────────────────────────────────────

      const Menu = {
        currentCategory: "all",
        container: null,
        navContainer: null,
        selectedVariations: {},

        init() {
          this.container = document.getElementById("menuContainer");
          this.navContainer = document.getElementById("categoryNavInner");
          this.renderCategories();
          this.renderItems("all");
          this.bindCategoryEvents();
          this.bindQuantityEvents();
          this.bindVariationEvents();
          return this;
        },

        renderCategories() {
          this.navContainer.innerHTML = CATEGORIES.map((cat) => {
            let icon = "";
            if (cat.id === "all") icon = '<i class="fas fa-th-list"></i>';
            else if (cat.id.includes("كريب"))
              icon = '<i class="fas fa-utensil-spoon"></i>';
            else if (cat.id.includes("بيتزا"))
              icon = '<i class="fas fa-pizza-slice"></i>';
            else if (cat.id.includes("كشري"))
              icon = '<i class="fas fa-bowl-food"></i>';
            else if (cat.id.includes("حلو"))
              icon = '<i class="fas fa-cake"></i>';
            else if (cat.id.includes("مشروبات"))
              icon = '<i class="fas fa-wine-bottle"></i>';
            else icon = '<i class="fas fa-circle"></i>';
            return `<button class="category-chip ${cat.id === "all" ? "active" : ""}" data-category="${cat.id}" type="button" role="tab" aria-selected="${cat.id === "all"}">${icon} ${cat.label}</button>`;
          }).join("");
        },

        renderItems(categoryId) {
          this.currentCategory = categoryId;
          const items =
            categoryId === "all"
              ? MENU_DATA
              : MENU_DATA.filter((item) => item.category === categoryId);
          const grouped = {};
          items.forEach((item) => {
            if (!grouped[item.category]) grouped[item.category] = [];
            grouped[item.category].push(item);
          });

          let html = "";
          for (const [cat, catItems] of Object.entries(grouped)) {
            html += `<div class="menu-section" data-category="${cat}"><h2 class="menu-section-title"><i class="fas fa-tag"></i> ${cat}</h2><div class="menu-grid">`;
            catItems.forEach((item, index) => {
              if (!this.selectedVariations[item.id]) {
                this.selectedVariations[item.id] = item.defaultVariation || 0;
              }
              const selectedIdx = this.selectedVariations[item.id];
              const selectedVar = item.variations[selectedIdx];
              const currentPrice = selectedVar
                ? selectedVar.price
                : item.variations[0].price;
              const cartItem = Cart.getItem(`${item.id}-${selectedVar.label}`);
              const qty = cartItem ? cartItem.quantity : 0;

              let variationsHtml = "";
              if (item.variations.length > 1) {
                variationsHtml = `<div class="variations">`;
                item.variations.forEach((v, idx) => {
                  const activeClass = idx === selectedIdx ? "active" : "";
                  variationsHtml += `<button class="variation-btn ${activeClass}" data-item-id="${item.id}" data-var-index="${idx}">${v.label}</button>`;
                });
                variationsHtml += `</div>`;
              }

              html += `
                                    <div class="menu-card" style="animation-delay: ${(index % 6) * 0.05}s" role="article" aria-label="${item.name}">
                                        <div class="menu-card-image-wrap">
                                            <img data-src="${item.image}" alt="${item.name}" loading="lazy" width="400" height="300" />
                                            <div class="menu-card-image-placeholder" aria-hidden="true"><i class="fas fa-utensils"></i></div>
                                        </div>
                                        <div class="menu-card-body">
                                            <h3 class="menu-card-name">${item.name}</h3>
                                            <p class="menu-card-desc">${item.desc}</p>
                                            ${variationsHtml}
                                            <div class="menu-card-footer">
                                                <span class="menu-card-price">${UI.formatPrice(currentPrice)}</span>
                                                <div class="menu-card-actions" data-item-id="${item.id}">
                                                    ${this.renderQuantityControls(item.id, qty)}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                `;
            });
            html += `</div></div>`;
          }

          this.container.innerHTML = html;
          const images = this.container.querySelectorAll("img[data-src]");
          LazyLoader.observeAll(images);
        },

        renderQuantityControls(itemId, qty) {
          if (qty > 0) {
            return `<div class="qty-controls" data-item-id="${itemId}">
                                <button class="qty-btn" data-action="decrease" aria-label="تقليل الكمية"><i class="fas fa-minus"></i></button>
                                <span class="qty-value" aria-label="الكمية">${qty}</span>
                                <button class="qty-btn" data-action="increase" aria-label="زيادة الكمية"><i class="fas fa-plus"></i></button>
                            </div>`;
          }
          return `<button class="qty-btn add" data-action="add" aria-label="إضافة إلى السلة"><i class="fas fa-plus"></i></button>`;
        },

        bindCategoryEvents() {
          this.navContainer.addEventListener("click", (e) => {
            const chip = e.target.closest(".category-chip");
            if (!chip) return;
            const cat = chip.dataset.category;
            if (cat === this.currentCategory) return;
            this.navContainer
              .querySelectorAll(".category-chip")
              .forEach((c) => {
                c.classList.remove("active");
                c.setAttribute("aria-selected", "false");
              });
            chip.classList.add("active");
            chip.setAttribute("aria-selected", "true");
            chip.scrollIntoView({
              behavior: "smooth",
              block: "nearest",
              inline: "center",
            });
            this.renderItems(cat);
          });
        },

        bindQuantityEvents() {
          this.container.addEventListener("click", (e) => {
            const btn = e.target.closest(".qty-btn");
            if (!btn) return;
            const controls = btn.closest("[data-item-id]");
            if (!controls) return;
            const itemId = controls.dataset.itemId;
            if (!itemId) return;
            const action = btn.dataset.action;
            const menuItem = MENU_DATA.find((i) => i.id === itemId);
            if (!menuItem) return;
            const selectedIdx = this.selectedVariations[itemId] || 0;
            const selectedVar = menuItem.variations[selectedIdx];

            if (action === "add") {
              Cart.addItem(menuItem, selectedIdx);
              App.updateCartUI();
              this.updateItemQuantity(itemId);
              btn.style.transform = "scale(0.8)";
              setTimeout(() => {
                btn.style.transform = "";
              }, 200);
              const badge = document.getElementById("cartBadge");
              if (badge) {
                badge.classList.remove("bump");
                void badge.offsetWidth;
                badge.classList.add("bump");
              }
            } else if (action === "increase") {
              const cartId = `${itemId}-${selectedVar.label}`;
              Cart.updateQuantity(cartId, 1);
              App.updateCartUI();
              this.updateItemQuantity(itemId);
            } else if (action === "decrease") {
              const cartId = `${itemId}-${selectedVar.label}`;
              Cart.updateQuantity(cartId, -1);
              App.updateCartUI();
              this.updateItemQuantity(itemId);
            }
          });
        },

        updateItemQuantity(itemId) {
          const menuItem = MENU_DATA.find((i) => i.id === itemId);
          if (!menuItem) return;
          const selectedIdx = this.selectedVariations[itemId] || 0;
          const selectedVar = menuItem.variations[selectedIdx];
          const cartId = `${itemId}-${selectedVar.label}`;
          const cartItem = Cart.getItem(cartId);
          const qty = cartItem ? cartItem.quantity : 0;
          const actionsEl = this.container.querySelector(
            `.menu-card-actions[data-item-id="${itemId}"]`,
          );
          if (!actionsEl) return;
          actionsEl.innerHTML = this.renderQuantityControls(itemId, qty);
        },

        bindVariationEvents() {
          this.container.addEventListener("click", (e) => {
            const btn = e.target.closest(".variation-btn");
            if (!btn) return;
            const itemId = btn.dataset.itemId;
            const varIndex = parseInt(btn.dataset.varIndex, 10);
            if (isNaN(varIndex)) return;
            const menuItem = MENU_DATA.find((i) => i.id === itemId);
            if (!menuItem) return;
            this.selectedVariations[itemId] = varIndex;

            const card = btn.closest(".menu-card");
            if (card) {
              const priceEl = card.querySelector(".menu-card-price");
              const selectedVar = menuItem.variations[varIndex];
              if (priceEl && selectedVar) {
                priceEl.textContent = UI.formatPrice(selectedVar.price);
              }
              const allVarBtns = card.querySelectorAll(".variation-btn");
              allVarBtns.forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");
              this.updateItemQuantity(itemId);
            }
          });
        },
      };

      // ─── CART UI ────────────────────────────────────────────────────────

      const CartUI = {
        modal: null,
        body: null,
        footer: null,
        countEl: null,
        isOpen: false,
        bound: false,

        init() {
          this.modal = document.getElementById("cartModal");
          this.body = document.getElementById("cartModalBody");
          this.footer = document.getElementById("cartModalFooter");
          this.countEl = document.getElementById("cartModalCount");

          document
            .getElementById("cartModalClose")
            .addEventListener("click", () => this.close());
          this.modal.addEventListener("click", (e) => {
            if (e.target === this.modal) this.close();
          });
          document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && this.isOpen) this.close();
          });

          this.bindBodyEvents();
          this.bindFooterEvents();
          this.bound = true;
          return this;
        },

        open() {
          this.isOpen = true;
          this.modal.classList.add("open");
          document.body.style.overflow = "hidden";
          this.render();
          document.getElementById("cartModalClose").focus();
        },

        close() {
          this.isOpen = false;
          this.modal.classList.remove("open");
          document.body.style.overflow = "";
          document.getElementById("cartBtn").focus();
        },

        render() {
          const items = Cart.getItems();
          const totalItems = Cart.getTotalItems();
          const totalPrice = Cart.getTotalPrice();
          this.countEl.textContent = totalItems;

          if (items.length === 0) {
            this.body.innerHTML = `<div class="cart-empty"><i class="fas fa-shopping-bag"></i><h3>السلة فارغة</h3><p>أضف بعض الأطباق الشهية من منيو كشري الزهراء</p></div>`;
            this.footer.innerHTML = `<button class="btn btn-secondary" id="continueShoppingBtn" style="width:100%;">استمر في التسوق</button>`;
            return;
          }

          let itemsHtml = "";
          items.forEach((item) => {
            itemsHtml += `
                                <div class="cart-item" data-item-id="${item.id}">
                                    <img class="cart-item-image" src="${item.image}" alt="${item.name}" loading="lazy" />
                                    <div class="cart-item-info">
                                        <div class="cart-item-name">${item.name}</div>
                                        <div class="cart-item-price">${UI.formatPrice(item.price)}</div>
                                    </div>
                                    <div class="cart-item-controls">
                                        <button class="qty-btn" data-action="cart-decrease" aria-label="تقليل الكمية"><i class="fas fa-minus"></i></button>
                                        <span class="qty-value">${item.quantity}</span>
                                        <button class="qty-btn" data-action="cart-increase" aria-label="زيادة الكمية"><i class="fas fa-plus"></i></button>
                                        <button class="cart-item-remove" data-action="cart-remove" aria-label="إزالة العنصر"><i class="fas fa-trash-alt"></i></button>
                                    </div>
                                </div>
                            `;
          });
          this.body.innerHTML = itemsHtml;

          this.footer.innerHTML = `
                            <div class="cart-summary">
                                <div class="cart-summary-row"><span>عدد العناصر</span><span>${totalItems}</span></div>
                                <div class="cart-summary-row total"><span>المجموع</span><span class="amount">${UI.formatPrice(totalPrice)}</span></div>
                            </div>
                            <div class="cart-actions">
                                <button class="btn btn-danger" id="clearCartBtn"><i class="fas fa-trash-alt"></i> مسح السلة</button>
                                <button class="btn btn-primary" id="checkoutBtn"><i class="fas fa-clipboard-list"></i> إتمام الطلب</button>
                            </div>
                        `;
        },

        bindBodyEvents() {
          this.body.addEventListener("click", (e) => {
            const btn = e.target.closest("button[data-action]");
            if (!btn) return;
            const action = btn.dataset.action;
            const itemEl = btn.closest(".cart-item");
            if (!itemEl) return;
            const id = itemEl.dataset.itemId;
            if (!id) return;

            if (action === "cart-increase") {
              Cart.updateQuantity(id, 1);
              App.updateCartUI();
              this.render();
              const baseId = id.split("-")[0];
              if (baseId) {
                Menu.updateItemQuantity(baseId);
              }
            } else if (action === "cart-decrease") {
              Cart.updateQuantity(id, -1);
              App.updateCartUI();
              this.render();
              const baseId = id.split("-")[0];
              if (baseId) {
                Menu.updateItemQuantity(baseId);
              }
            } else if (action === "cart-remove") {
              Swal.fire({
                title: "إزالة العنصر؟",
                text: `هل تريد إزالة هذا العنصر من السلة؟`,
                icon: "question",
                showCancelButton: true,
                confirmButtonColor: "#A61C2C",
                cancelButtonColor: "#A68B7A",
                confirmButtonText: "نعم، إزالة",
                cancelButtonText: "إلغاء",
              }).then((result) => {
                if (result.isConfirmed) {
                  Cart.removeItem(id);
                  App.updateCartUI();
                  this.render();
                  const baseId = id.split("-")[0];
                  if (baseId) {
                    Menu.updateItemQuantity(baseId);
                  }
                }
              });
            }
          });
        },

        bindFooterEvents() {
          this.footer.addEventListener("click", (e) => {
            if (e.target.closest("#continueShoppingBtn")) {
              this.close();
              return;
            }
            if (e.target.closest("#clearCartBtn")) {
              Swal.fire({
                title: "مسح السلة؟",
                text: "سيتم حذف جميع العناصر من السلة",
                icon: "warning",
                showCancelButton: true,
                confirmButtonColor: "#A61C2C",
                cancelButtonColor: "#A68B7A",
                confirmButtonText: "نعم، مسح الكل",
                cancelButtonText: "إلغاء",
              }).then((result) => {
                if (result.isConfirmed) {
                  Cart.clear();
                  App.updateCartUI();
                  this.render();
                  Menu.renderItems(Menu.currentCategory);
                  Swal.fire("تم المسح", "تم إفراغ السلة بنجاح", "success");
                }
              });
              return;
            }
            if (e.target.closest("#checkoutBtn")) {
              this.close();
              CheckoutUI.open();
            }
          });
        },
      };

      // ─── CHECKOUT UI ────────────────────────────────────────────────────

      const CheckoutUI = {
        modal: null,
        body: null,
        isOpen: false,
        DELIVERY_WHATSAPP: "201040346247",
        DINEIN_WHATSAPP: "201040346247",

        init() {
          this.modal = document.getElementById("checkoutModal");
          this.body = document.getElementById("checkoutModalBody");
          document
            .getElementById("checkoutModalClose")
            .addEventListener("click", () => this.close());
          this.modal.addEventListener("click", (e) => {
            if (e.target === this.modal) this.close();
          });
          document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && this.isOpen) this.close();
          });
          return this;
        },

        open() {
          this.isOpen = true;
          this.modal.classList.add("open");
          document.body.style.overflow = "hidden";
          this.render();
          document.getElementById("checkoutModalClose").focus();
        },

        close() {
          this.isOpen = false;
          this.modal.classList.remove("open");
          document.body.style.overflow = "";
        },

        render() {
          const items = Cart.getItems();
          const totalItems = Cart.getTotalItems();
          const totalPrice = Cart.getTotalPrice();
          const isDineIn = orderType === "dinein";

          if (items.length === 0) {
            this.body.innerHTML = `<div class="cart-empty"><i class="fas fa-clipboard-list"></i><h3>السلة فارغة</h3><p>أضف أطباقك المفضلة أولاً</p><button class="btn btn-primary" id="backToCartBtn" style="margin-top:var(--space-md);">العودة للسلة</button></div>`;
            const backBtn = document.getElementById("backToCartBtn");
            if (backBtn) {
              backBtn.addEventListener("click", () => {
                this.close();
                CartUI.open();
              });
            }
            return;
          }

          const branchOptions = BRANCHES.map(
            (b) => `<option value="${b.id}">${b.name}</option>`,
          ).join("");

          // Build summary of items
          let summaryHtml = "";
          items.forEach((item) => {
            summaryHtml += `<div style="display:flex;justify-content:space-between;font-size:14px;padding:var(--space-xs) 0;border-bottom:1px solid var(--outline-variant);"><span>${item.name} × ${item.quantity}</span><span>${UI.formatPrice(item.price * item.quantity)}</span></div>`;
          });

          // ─── Build the form conditionally ──────────────────────────

          let formHtml = `<form class="checkout-form" id="checkoutForm" novalidate>`;

          // ── DINE-IN FIELDS ──
          if (isDineIn) {
            formHtml += `
                                <div class="form-group" id="tableGroup">
                                    <label for="tableNumber">رقم الترابيزه  *</label>
                                    <input type="text" id="tableNumber" placeholder="أدخل رقم الترابيزه الذي تجلس عليه" required aria-required="true" autofocus />
                                    <span class="error-text">الرجاء إدخال رقم الترابيزه</span>
                                </div>
                                <div class="form-group" id="nameGroup">
                                    <label for="customerName">الاسم الكامل *</label>
                                    <input type="text" id="customerName" placeholder="أدخل اسمك الكامل" required aria-required="true" autocomplete="name" />
                                    <span class="error-text">الرجاء إدخال الاسم</span>
                                </div>
                            `;
          } else {
            // ── DELIVERY FIELDS ──
            formHtml += `
                                <div class="form-group" id="branchGroup">
                                    <label for="customerBranch">اختر الفرع *</label>
                                    <select id="customerBranch" required>
                                        <option value="">-- اختر فرع --</option>
                                        ${branchOptions}
                                    </select>
                                    <span class="error-text">الرجاء اختيار فرع</span>
                                </div>
                                <div class="form-group" id="nameGroup">
                                    <label for="customerName">الاسم الكامل *</label>
                                    <input type="text" id="customerName" placeholder="أدخل اسمك الكامل" required aria-required="true" autocomplete="name" />
                                    <span class="error-text">الرجاء إدخال الاسم</span>
                                </div>
                                <div class="form-group" id="phoneGroup">
                                    <label for="customerPhone">رقم الهاتف *</label>
                                    <input type="tel" id="customerPhone" placeholder="مثال: 0123456789" required aria-required="true" autocomplete="tel" />
                                    <span class="error-text">الرجاء إدخال رقم هاتف صحيح</span>
                                </div>
                                <div class="form-group" id="addressGroup">
                                    <label for="customerAddress">العنوان *</label>
                                    <input type="text" id="customerAddress" placeholder="أدخل عنوان التوصيل" required aria-required="true" autocomplete="address-line1" />
                                    <span class="error-text">الرجاء إدخال العنوان</span>
                                </div>
                                <div class="form-group">
                                    <label for="customerNotes">ملاحظات إضافية</label>
                                    <textarea id="customerNotes" placeholder="مثل: توصيل سريع، طلب خاص، إلخ..." rows="2"></textarea>
                                </div>
                            `;
          }

          // ── ORDER SUMMARY ── (same for both)
          formHtml += `
                            <div class="checkout-summary">
                                <div style="font-weight:700;color:var(--on-surface);margin-bottom:var(--space-xs);">ملخص الطلب</div>
                                ${summaryHtml}
                                <div class="row total"><span>المجموع الكلي</span><span class="amount">${UI.formatPrice(totalPrice)}</span></div>
                                <div style="font-size:13px;color:var(--on-surface-variant);opacity:0.7;margin-top:var(--space-xs);">عدد العناصر: ${totalItems}</div>
                            </div>
                            <button type="submit" class="btn btn-primary" style="width:100%;padding:var(--space-lg);font-size:16px;"><i class="fab fa-whatsapp"></i> أطلب عبر واتساب</button>
                        </form>`;

          this.body.innerHTML = formHtml;

          // ─── Bind form submit ──────────────────────────────────────
          const form = document.getElementById("checkoutForm");
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            this.handleSubmit();
          });

          // ─── Bind validation events ────────────────────────────────
          const fields = isDineIn
            ? ["tableNumber", "customerName"]
            : [
                "customerBranch",
                "customerName",
                "customerPhone",
                "customerAddress",
              ];

          fields.forEach((id) => {
            const input = document.getElementById(id);
            if (!input) return;
            const blurHandler = () => {
              const group = input.closest(".form-group");
              if (group) {
                const val = input.value.trim();
                if (val === "" || (id === "customerBranch" && val === "")) {
                  group.classList.add("invalid");
                } else {
                  group.classList.remove("invalid");
                }
              }
            };
            input.addEventListener("blur", blurHandler);
            input.addEventListener("change", blurHandler);
            input.addEventListener("input", () => {
              const group = input.closest(".form-group");
              if (group && group.classList.contains("invalid")) {
                const val = input.value.trim();
                if (val !== "" && !(id === "customerBranch" && val === "")) {
                  group.classList.remove("invalid");
                }
              }
            });
          });

          // Auto-focus first field
          const firstInput = this.body.querySelector("input, select, textarea");
          if (firstInput) {
            setTimeout(() => firstInput.focus(), 300);
          }
        },

        handleSubmit() {
          const isDineIn = orderType === "dinein";

          // ─── Gather values ─────────────────────────────────────────
          let branch = "";
          let branchName = "";
          let name = "";
          let phone = "";
          let address = "";
          let notes = "";
          let table = "";

          if (isDineIn) {
            table = document.getElementById("tableNumber").value.trim();
            name = document.getElementById("customerName").value.trim();
          } else {
            branch = document.getElementById("customerBranch").value;
            branchName = BRANCHES.find((b) => b.id === branch)?.name || "";
            name = document.getElementById("customerName").value.trim();
            phone = document.getElementById("customerPhone").value.trim();
            address = document.getElementById("customerAddress").value.trim();
            notes = document.getElementById("customerNotes").value.trim();
          }

          // ─── Validate ──────────────────────────────────────────────
          let valid = true;

          if (isDineIn) {
            const tableGroup = document.getElementById("tableGroup");
            const nameGroup = document.getElementById("nameGroup");
            if (!table) {
              tableGroup.classList.add("invalid");
              valid = false;
            } else {
              tableGroup.classList.remove("invalid");
            }
            if (!name) {
              nameGroup.classList.add("invalid");
              valid = false;
            } else {
              nameGroup.classList.remove("invalid");
            }
          } else {
            const branchGroup = document.getElementById("branchGroup");
            const nameGroup = document.getElementById("nameGroup");
            const phoneGroup = document.getElementById("phoneGroup");
            const addressGroup = document.getElementById("addressGroup");

            if (!branch) {
              branchGroup.classList.add("invalid");
              valid = false;
            } else {
              branchGroup.classList.remove("invalid");
            }
            if (!name) {
              nameGroup.classList.add("invalid");
              valid = false;
            } else {
              nameGroup.classList.remove("invalid");
            }
            if (!phone || phone.length < 10) {
              phoneGroup.classList.add("invalid");
              valid = false;
            } else {
              phoneGroup.classList.remove("invalid");
            }
            if (!address) {
              addressGroup.classList.add("invalid");
              valid = false;
            } else {
              addressGroup.classList.remove("invalid");
            }
          }

          if (!valid) {
            Swal.fire({
              title: "بيانات ناقصة",
              text: "الرجاء ملء جميع الحقول المطلوبة",
              icon: "error",
              confirmButtonColor: "#A61C2C",
            });
            return;
          }

          // ─── Build WhatsApp message ────────────────────────────────
          const items = Cart.getItems();
          const orderTypeLabel = isDineIn ? "صالة" : "دليفري";

          let orderText = `🍽️ *طلب جديد من كشري الزهراء*%0A%0A`;
          orderText += `📋 *نوع الطلب:* ${orderTypeLabel}%0A`;

          if (isDineIn) {
            // Dine-in: use first branch as default (since we don't ask)
            const defaultBranch = BRANCHES[0];
            orderText += `📍 *الفرع:* ${encodeURIComponent(defaultBranch.name)}%0A`;
            orderText += `🪑 *رقم الترابيزه:* ${encodeURIComponent(table)}%0A`;
            orderText += `👤 *الاسم:* ${encodeURIComponent(name)}%0A`;
          } else {
            orderText += `📍 *الفرع:* ${encodeURIComponent(branchName)}%0A`;
            orderText += `👤 *الاسم:* ${encodeURIComponent(name)}%0A`;
            orderText += `📱 *الهاتف:* ${encodeURIComponent(phone)}%0A`;
            orderText += `📍 *العنوان:* ${encodeURIComponent(address)}%0A`;
            if (notes)
              orderText += `📝 *ملاحظات:* ${encodeURIComponent(notes)}%0A`;
          }

          orderText += `%0A*🧾 الطلب:*%0A`;
          items.forEach((item, i) => {
            orderText += `${i + 1}. ${encodeURIComponent(item.name)} × ${item.quantity} = ${UI.formatPrice(item.price * item.quantity)}%0A`;
          });
          orderText += `%0A💰 *المجموع الكلي:* ${UI.formatPrice(Cart.getTotalPrice())}%0A`;
          orderText += `%0A🙏 *شكراً لتسوقكم مع كشري الزهراء!*`;

          // ─── Choose WhatsApp number ────────────────────────────────
          const whatsappNumber = isDineIn
            ? this.DINEIN_WHATSAPP
            : this.DELIVERY_WHATSAPP;
          const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${orderText}`;

          Swal.fire({
            title: "✅ تم إتمام الطلب!",
            text: `سيتم تحويلك إلى واتساب المطعم (${orderTypeLabel}) لإرسال الطلب`,
            icon: "success",
            confirmButtonColor: "#A61C2C",
            confirmButtonText: "📱 أرسل الطلب",
            showCancelButton: true,
            cancelButtonText: "إلغاء",
          }).then((result) => {
            if (result.isConfirmed) {
              Cart.clear();
              App.updateCartUI();
              Menu.renderItems(Menu.currentCategory);
              this.close();
              window.open(whatsappUrl, "_blank");
              Swal.fire({
                title: "شكراً لك!",
                text: "تم إرسال طلبك إلى كشري الزهراء. سنتواصل معك قريباً.",
                icon: "success",
                confirmButtonColor: "#A61C2C",
              });
            }
          });
        },
      };

      // ─── BRANCHES UI ────────────────────────────────────────────────────

      const BranchesUI = {
        modal: null,
        body: null,
        isOpen: false,

        init() {
          this.modal = document.getElementById("branchesModal");
          this.body = document.getElementById("branchesModalBody");
          document
            .getElementById("branchesModalClose")
            .addEventListener("click", () => this.close());
          this.modal.addEventListener("click", (e) => {
            if (e.target === this.modal) this.close();
          });
          document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && this.isOpen) this.close();
          });
          document
            .getElementById("branchesBtn")
            .addEventListener("click", () => this.open());
          return this;
        },

        open() {
          this.isOpen = true;
          this.modal.classList.add("open");
          document.body.style.overflow = "hidden";
          this.render();
          document.getElementById("branchesModalClose").focus();
        },

        close() {
          this.isOpen = false;
          this.modal.classList.remove("open");
          document.body.style.overflow = "";
        },

        render() {
          this.body.innerHTML = `
                            <div class="branches-grid">
                                ${BRANCHES.map(
                                  (branch) => `
                                    <div class="branch-card">
                                        <div class="branch-icon"><i class="fas fa-store"></i></div>
                                        <div class="branch-info">
                                            <div class="branch-name">${branch.name}</div>
                                            <div class="branch-address">${branch.address}</div>
                                            <div class="branch-phone">
                                                <i class="fas fa-phone-alt"></i>
                                                <span>${BRANCH_PHONES}</span>
                                            </div>
                                        </div>
                                        <a href="${branch.mapUrl}" target="_blank" rel="noopener noreferrer" class="branch-map-btn" aria-label="فتح الموقع على خرائط جوجل"><i class="fas fa-map-marked-alt"></i> خريطة</a>
                                    </div>
                                `,
                                ).join("")}
                            </div>
                        `;
        },
      };

      // ─── CHOICE UI ──────────────────────────────────────────────────────

      const ChoiceUI = {
        modal: null,
        isOpen: false,

        init() {
          this.modal = document.getElementById("choiceModal");
          document
            .getElementById("deliveryChoice")
            .addEventListener("click", () => {
              orderType = "delivery";
              document.body.classList.add("order-type-delivery");
              document.body.classList.remove("order-type-dinein");
              this.close();
              App.startApp();
            });
          document
            .getElementById("dineinChoice")
            .addEventListener("click", () => {
              orderType = "dinein";
              document.body.classList.add("order-type-dinein");
              document.body.classList.remove("order-type-delivery");
              this.close();
              App.startApp();
            });
          this.modal.addEventListener("click", (e) => {
            if (e.target === this.modal) return;
          });
          document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") return;
          });
          return this;
        },

        open() {
          this.isOpen = true;
          this.modal.classList.add("open");
          document.body.style.overflow = "hidden";
        },

        close() {
          this.isOpen = false;
          this.modal.classList.remove("open");
          document.body.style.overflow = "";
        },
      };

      // ─── APP ────────────────────────────────────────────────────────────

      const App = {
        initialized: false,

        init() {
          ChoiceUI.init();
          ChoiceUI.open();
        },

        startApp() {
          if (this.initialized) return;
          this.initialized = true;

          Cart.init();
          Menu.init();
          CartUI.init();
          CheckoutUI.init();
          BranchesUI.init();

          document.getElementById("cartBtn").addEventListener("click", () => {
            CartUI.open();
          });
          this.updateCartUI();

          const header = document.getElementById("appHeader");
          window.addEventListener(
            "scroll",
            UI.throttleRAF(() => {
              if (window.scrollY > 10) {
                header.classList.add("scrolled");
              } else {
                header.classList.remove("scrolled");
              }
            }),
          );

          const prefersReduced = window.matchMedia(
            "(prefers-reduced-motion: reduce)",
          );
          if (prefersReduced.matches) {
            document.querySelectorAll(".menu-card").forEach((el) => {
              el.style.animation = "none";
              el.style.opacity = "1";
              el.style.transform = "none";
            });
          }
          console.log(
            "🌿 كشري الزهراء — تم تحميل الموقع بنجاح، نوع الطلب:",
            orderType,
          );
        },

        updateCartUI() {
          const total = Cart.getTotalItems();
          const badge = document.getElementById("cartBadge");
          const label = document.getElementById("cartLabel");
          if (badge) {
            badge.textContent = total;
            badge.style.display = total > 0 ? "flex" : "none";
          }
          if (label) {
            label.textContent = total > 0 ? `السلة (${total})` : "السلة";
          }
          const countEl = document.getElementById("cartModalCount");
          if (countEl) countEl.textContent = total;
        },
      };

      document.addEventListener("DOMContentLoaded", () => {
        App.init();
      });

      // Expose for debugging
      window.App = App;
      window.Menu = Menu;
      window.CartUI = CartUI;
      window.CheckoutUI = CheckoutUI;
      window.BranchesUI = BranchesUI;
    </script>
  </body>
</html>
