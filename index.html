              confirmButtonColor: "#1a3a6b",
            });
            return;
          }

          const items = Cart.getItems();

          let orderText = `🍽️ *طلب جديد من كشري الزهراء*%0A%0A`;
          orderText += `📋 *نوع الطلب:* دليفري%0A`;
          orderText += `📍 *الفرع:* ${encodeURIComponent(branchName)}%0A`;
          orderText += `👤 *الاسم:* ${encodeURIComponent(name)}%0A`;
          orderText += `📱 *الهاتف:* ${encodeURIComponent(phone)}%0A`;
          orderText += `📍 *العنوان:* ${encodeURIComponent(address)}%0A`;
          if (notes)
            orderText += `📝 *ملاحظات:* ${encodeURIComponent(notes)}%0A`;

          orderText += `%0A*🧾 الطلب:*%0A`;
          items.forEach((item, i) => {
            const menuItem = this.getMenuItemFromCartItem(item);
            const category = menuItem ? menuItem.category : "";
            let categoryLabel = "";
            if (category === "البيتزا الإيطالي") categoryLabel = "بيتزا ايطالي";
            else if (category === "البيتزا الشرقي")
              categoryLabel = "بيتزا شرقي";
            const displayName = categoryLabel
              ? `${item.name} - ${categoryLabel}`
              : item.name;
            orderText += `${i + 1}. ${encodeURIComponent(displayName)} × ${item.quantity} = ${UI.formatPrice(item.price * item.quantity)}%0A`;
          });

          orderText += `%0A💰 *المجموع الكلي:* ${UI.formatPrice(Cart.getTotalPrice())}%0A`;
          orderText += `%0A⚠️ *ملحوظة:* السعر غير شامل خدمة التوصيل%0A`;
          orderText += `%0A*شكراً لشرائكم من كشري الزهراء*\u200F ❤️`;

          const whatsappNumber = this.DELIVERY_WHATSAPP;
          const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${orderText}`;

          Swal.fire({
            title: "✅ تم إتمام الطلب!",
            text: `سيتم تحويلك إلى واتساب المطعم لإرسال الطلب`,
            icon: "success",
            confirmButtonColor: "#1a3a6b",
            confirmButtonText: "📱 أرسل الطلب",
            showCancelButton: true,
            cancelButtonText: "إلغاء",
          }).then((result) => {
            if (result.isConfirmed) {
              Cart.clear();
              App.updateCartUI();
              Menu.renderItems(Menu.currentCategory);
              this.close();
              window.open(whatsappUrl, "_blank");
              Swal.fire({
                title: "شكراً لك!",
                text: "تم إرسال طلبك إلى كشري الزهراء. سنتواصل معك قريباً.",
                icon: "success",
                confirmButtonColor: "#1a3a6b",
              });
            }
          });

      };

      const BranchesUI = {
        modal: null,
        body: null,

            </div>

      const App = {
        initialized: false,

        init() {
          LazyLoader.init();

        startApp() {
          if (this.initialized) return;
          this.initialized = true;

          Cart.init();
          Menu.init();
          CartUI.init();
          CheckoutUI.init();

          document.getElementById("cartBtn").addEventListener("click", () => {

          this.updateCartUI();

          const header = document.getElementById("appHeader");
          window.addEventListener(
            "scroll",
            UI.throttleRAF(() => {
              if (window.scrollY > 10) header.classList.add("scrolled");
              else header.classList.remove("scrolled");
            }),
          );

          const prefersReduced = window.matchMedia(
            "(prefers-reduced-motion: reduce)",
          );
          if (prefersReduced.matches) {
            document.querySelectorAll(".menu-card").forEach((el) => {
              el.style.animation = "none";
              el.style.opacity = "1";
              el.style.transform = "none";
            });
          }
          console.log("🌿 كشري الزهراء — تم تحميل الموقع بنجاح (دليفري)");
        },

        updateCartUI() {
          const total = Cart.getTotalItems();
          const badge = document.getElementById("cartBadge");
          const label = document.getElementById("cartLabel");
          if (badge) {
            badge.textContent = total;
            badge.style.display = total > 0 ? "flex" : "none";
          }
          if (label)
            label.textContent = total > 0 ? `السلة (${total})` : "السلة";
          const countEl = document.getElementById("cartModalCount");
          if (countEl) countEl.textContent = total;
        },
      };

      document.addEventListener("DOMContentLoaded", () => {
        App.init();
      });

      window.App = App;
      window.Menu = Menu;
      window.CartUI = CartUI;
      window.CheckoutUI = CheckoutUI;
      window.BranchesUI = BranchesUI;
      window.LazyLoader = LazyLoader;
    </script>
  </body>
</html>
