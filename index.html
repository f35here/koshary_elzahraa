<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>كشري الزهراء - أطلب أونلاين</title>

    <!-- Favicon -->
    <link rel="icon" href="test/logo/logo.jpg" type="image/jpeg" />
    <link rel="shortcut icon" href="test/logo/logo.jpg" type="image/jpeg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome 6 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      /* ============================================================
               ROOT – Refined Professional Palette
               ============================================================ */
      :root {
        --primary: #a61c2c;
        --primary-light: #c62828;
        --primary-dark: #8b1a1a;
        --primary-gradient: linear-gradient(135deg, #a61c2c 0%, #c62828 100%);
        --on-primary: #ffffff;

        --secondary: #b8860b;
        --secondary-light: #d4a017;
        --secondary-dark: #8b6508;
        --secondary-gradient: linear-gradient(135deg, #b8860b 0%, #d4a017 100%);
        --on-secondary: #ffffff;

        --tertiary: #5d6d4a;
        --on-tertiary: #ffffff;

        --surface: #f8f5f2;
        --surface-dim: #ede8e2;
        --surface-bright: #fcfaf7;
        --surface-container-lowest: #ffffff;
        --surface-container-low: #f6f1eb;
        --surface-container: #efeae4;
        --surface-container-high: #e8e1d9;
        --surface-container-highest: #dfd7ce;
        --on-surface: #2c1f16;
        --on-surface-variant: #5e4b3c;

        --inverse-surface: #3d2c20;
        --inverse-on-surface: #f8f5f2;

        --outline: #a68b7a;
        --outline-variant: #d5c5b8;

        --error: #b71c1c;
        --on-error: #ffffff;
        --error-container: #ffcdd2;
        --on-error-container: #8b1a1a;

        --font-display: "Be Vietnam Pro", sans-serif;
        --font-body: "Be Vietnam Pro", sans-serif;
        --font-label: "Plus Jakarta Sans", sans-serif;

        --display-lg: 900 48px/56px var(--font-display);
        --headline-lg: 800 32px/40px var(--font-display);
        --headline-lg-mobile: 800 24px/32px var(--font-display);
        --headline-md: 700 24px/32px var(--font-display);
        --title-lg: 700 20px/28px var(--font-display);
        --title-md: 600 18px/26px var(--font-display);
        --body-lg: 400 18px/28px var(--font-display);
        --body-md: 400 16px/26px var(--font-display);
        --body-sm: 400 14px/22px var(--font-display);
        --label-lg: 700 14px/20px var(--font-label);
        --label-md: 600 12px/18px var(--font-label);
        --label-sm: 700 11px/14px var(--font-label);

        --space-xs: 4px;
        --space-sm: 8px;
        --space-md: 16px;
        --space-lg: 24px;
        --space-xl: 32px;
        --space-2xl: 40px;
        --space-3xl: 56px;
        --space-4xl: 72px;

        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-xl: 16px;
        --radius-2xl: 20px;
        --radius-full: 9999px;

        --shadow-xs: 0 1px 2px rgba(44, 31, 22, 0.04);
        --shadow-sm: 0 2px 6px rgba(44, 31, 22, 0.06);
        --shadow-md: 0 4px 16px rgba(44, 31, 22, 0.08);
        --shadow-lg: 0 8px 32px rgba(44, 31, 22, 0.12);
        --shadow-xl: 0 16px 48px rgba(44, 31, 22, 0.16);
        --shadow-glow: 0 0 30px rgba(166, 28, 44, 0.12);

        --glass-bg: rgba(255, 255, 255, 0.82);
        --glass-border: rgba(255, 255, 255, 0.3);
        --glass-blur: 18px;

        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

        --duration-fast: 160ms;
        --duration-med: 320ms;
        --duration-slow: 500ms;

        --container-margin: 16px;
        --container-max: 1240px;
      }

      /* ============================================================
               RESET & BASE
               ============================================================ */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font: var(--body-md);
        background: var(--surface);
        color: var(--on-surface);
        font-family: var(--font-body);
        padding-bottom: 100px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      [dir="rtl"] {
        text-align: right;
      }

      :focus-visible {
        outline: 2.5px solid var(--primary);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }

      img {
        display: block;
        max-width: 100%;
        height: auto;
      }

      button {
        cursor: pointer;
        font-family: inherit;
        border: none;
        background: none;
        color: inherit;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .container {
        width: 100%;
        max-width: var(--container-max);
        margin: 0 auto;
        padding: 0 var(--container-margin);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }

      /* ============================================================
               SCROLLBAR
               ============================================================ */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: var(--surface-container);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--outline-variant);
        border-radius: var(--radius-full);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--outline);
      }

      /* ============================================================
               HEADER
               ============================================================ */
      .header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--glass-bg);
        backdrop-filter: blur(var(--glass-blur));
        -webkit-backdrop-filter: blur(var(--glass-blur));
        border-bottom: 1px solid var(--glass-border);
        transition:
          box-shadow var(--duration-med) var(--ease-out),
          background var(--duration-med) var(--ease-out);
      }

      .header.scrolled {
        box-shadow: var(--shadow-md);
        background: rgba(255, 255, 255, 0.94);
      }

      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-sm) var(--container-margin);
        min-height: 64px;
        gap: var(--space-sm);
      }

      .header-brand {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        flex-shrink: 0;
      }

      .header-logo {
        width: 44px;
        height: 44px;
        border-radius: var(--radius-md);
        overflow: hidden;
        flex-shrink: 0;
        box-shadow: var(--shadow-sm);
        background: var(--surface-container);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .header-logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .header-logo:hover {
        transform: scale(1.04);
        transition: transform var(--duration-med) var(--ease-spring);
      }

      .header-brand-text {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
      }

      .header-brand-name {
        font-size: 20px;
        font-weight: 800;
        color: var(--on-surface);
        letter-spacing: -0.02em;
      }

      .header-brand-name span {
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .header-brand-slogan {
        font-size: 11px;
        color: var(--on-surface-variant);
        opacity: 0.7;
        font-weight: 500;
        letter-spacing: 0.04em;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        flex-shrink: 0;
      }

      .header-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-xs);
        padding: var(--space-xs) var(--space-md);
        border-radius: var(--radius-full);
        font-size: 12px;
        font-weight: 700;
        background: var(--surface-container);
        color: var(--on-surface);
        transition: all var(--duration-fast) var(--ease-out);
        border: 1px solid transparent;
        white-space: nowrap;
        min-height: 36px;
        position: relative;
      }

      .header-btn:hover {
        background: var(--surface-container-high);
        transform: translateY(-1px);
        box-shadow: var(--shadow-sm);
      }

      .header-btn:active {
        transform: scale(0.94);
      }

      .header-btn-branches {
        background: var(--surface-container-low);
        border-color: var(--outline-variant);
      }

      .header-btn-branches:hover {
        border-color: var(--outline);
      }

      .header-btn-cart {
        background: var(--primary-gradient);
        color: var(--on-primary);
        padding: var(--space-xs) var(--space-lg);
        min-width: 52px;
        justify-content: center;
        box-shadow: var(--shadow-sm);
      }

      .header-btn-cart:hover {
        box-shadow: var(--shadow-md);
        transform: translateY(-1px) scale(1.02);
      }

      .header-btn-cart:active {
        transform: scale(0.94);
      }

      .header-btn-label {
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .cart-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        background: var(--secondary-gradient);
        color: var(--on-secondary);
        font-size: 10px;
        font-weight: 800;
        min-width: 20px;
        height: 20px;
        border-radius: var(--radius-full);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 6px;
        border: 2px solid var(--surface-container-lowest);
        transition: transform var(--duration-med) var(--ease-spring);
        box-shadow: var(--shadow-xs);
      }

      .cart-badge.bump {
        animation: bump 0.45s var(--ease-spring);
      }

      @keyframes bump {
        0% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.5);
        }
        70% {
          transform: scale(0.85);
        }
        100% {
          transform: scale(1);
        }
      }

      /* ============================================================
               MAIN
               ============================================================ */
      .main-content {
        flex: 1;
        padding-top: var(--space-lg);
      }

      /* ============================================================
               CATEGORY NAV – Fixed Bottom
               ============================================================ */
      .category-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 90;
        padding: var(--space-xs) 0 var(--space-sm);
        background: var(--glass-bg);
        backdrop-filter: blur(var(--glass-blur));
        -webkit-backdrop-filter: blur(var(--glass-blur));
        border-top: 1px solid var(--glass-border);
        box-shadow: 0 -4px 24px rgba(44, 31, 22, 0.06);
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .category-nav::-webkit-scrollbar {
        display: none;
      }

      .category-nav-inner {
        display: flex;
        gap: var(--space-sm);
        padding: 0 var(--container-margin);
        min-width: max-content;
        align-items: center;
      }

      .category-chip {
        flex-shrink: 0;
        padding: var(--space-sm) var(--space-lg);
        border-radius: var(--radius-full);
        font-size: 13px;
        font-weight: 600;
        background: var(--surface-container);
        color: var(--on-surface-variant);
        border: 1px solid var(--outline-variant);
        transition: all var(--duration-fast) var(--ease-out);
        white-space: nowrap;
        user-select: none;
        min-height: 36px;
        display: flex;
        align-items: center;
        gap: var(--space-xs);
      }

      .category-chip:hover {
        background: var(--surface-container-high);
        transform: translateY(-1px);
        box-shadow: var(--shadow-sm);
      }

      .category-chip:active {
        transform: scale(0.94);
      }

      .category-chip.active {
        background: var(--primary-gradient);
        color: var(--on-primary);
        border-color: transparent;
        font-weight: 700;
        box-shadow: var(--shadow-md);
        transform: translateY(-1px);
      }

      .category-chip i {
        font-size: 13px;
        opacity: 0.8;
      }

      .category-chip.active i {
        opacity: 1;
      }

      /* ============================================================
               MENU SECTIONS
               ============================================================ */
      .menu-section {
        margin-bottom: var(--space-2xl);
      }

      .menu-section-title {
        font: var(--headline-md);
        color: var(--on-surface);
        margin-bottom: var(--space-md);
        padding: 0 var(--container-margin);
        display: flex;
        align-items: center;
        gap: var(--space-md);
        position: relative;
      }

      .menu-section-title::after {
        content: "";
        flex: 1;
        height: 1.5px;
        background: linear-gradient(
          90deg,
          var(--outline-variant) 0%,
          transparent 100%
        );
        border-radius: var(--radius-full);
      }

      .menu-section-title i {
        color: var(--primary);
        font-size: 22px;
        opacity: 0.8;
      }

      /* ============================================================
               MENU GRID
               ============================================================ */
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: var(--space-md);
        padding: 0 var(--container-margin);
      }

      /* ============================================================
               MENU CARD
               ============================================================ */
      .menu-card {
        background: var(--surface-container-lowest);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-xs);
        transition: all var(--duration-med) var(--ease-out);
        border: 1px solid var(--surface-container);
        display: flex;
        flex-direction: column;
        position: relative;
        opacity: 0;
        transform: translateY(16px);
        animation: cardFadeIn 0.5s var(--ease-spring) forwards;
        will-change: transform, opacity;
      }

      .menu-card:hover {
        box-shadow: var(--shadow-md);
        transform: translateY(-3px);
        border-color: var(--outline-variant);
      }

      .menu-card:active {
        transform: scale(0.98);
      }

      @keyframes cardFadeIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .menu-card-image-wrap {
        position: relative;
        padding-top: 60%;
        background: var(--surface-container);
        overflow: hidden;
      }

      .menu-card-image-wrap img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition:
          transform var(--duration-slow) var(--ease-out),
          opacity var(--duration-med) var(--ease-out);
        opacity: 0;
      }

      .menu-card-image-wrap img.loaded {
        opacity: 1;
      }

      .menu-card:hover .menu-card-image-wrap img {
        transform: scale(1.05);
      }

      .menu-card-image-placeholder {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface-container);
        color: var(--on-surface-variant);
        font-size: 28px;
        opacity: 1;
        transition: opacity var(--duration-med) var(--ease-out);
      }

      .menu-card-image-placeholder.hidden {
        opacity: 0;
      }

      .menu-card-body {
        padding: var(--space-md);
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: var(--space-xs);
      }

      .menu-card-name {
        font: var(--title-md);
        color: var(--on-surface);
        line-height: 1.2;
        display: flex;
        align-items: center;
        gap: var(--space-xs);
      }

      /* ============================================================
               MENU CARD DESCRIPTION – Readable & Attractive
               ============================================================ */
      .menu-card-desc {
        font: var(--body-sm);
        font-size: 12.5px;
        color: var(--on-surface-variant);
        line-height: 1.65;
        letter-spacing: 0.01em;
        padding: 6px 9px;
        margin-top: 2px;
        border-radius: var(--radius-sm);
        background: var(--surface-container-low);
        border-inline-start: 3px solid var(--secondary-light);
        /* show the full text – no more truncation */
        display: block;
        -webkit-line-clamp: unset;
        -webkit-box-orient: unset;
        white-space: normal;
        overflow: visible;
        overflow-wrap: break-word;
        word-break: break-word;
        text-overflow: clip;
        transition:
          background var(--duration-fast) var(--ease-out),
          border-color var(--duration-fast) var(--ease-out);
      }

      .menu-card:hover .menu-card-desc {
        background: var(--surface-container);
        border-inline-start-color: var(--secondary);
      }

      .variations {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: var(--space-xs) 0;
      }

      .variation-btn {
        padding: 2px 10px;
        border-radius: var(--radius-full);
        font-size: 10px;
        font-weight: 700;
        background: var(--surface-container);
        color: var(--on-surface-variant);
        border: 1px solid var(--outline-variant);
        transition: all var(--duration-fast) var(--ease-out);
        cursor: pointer;
        flex: 1 0 auto;
        max-width: 60px;
        text-align: center;
        white-space: nowrap;
        letter-spacing: 0.02em;
      }

      .variation-btn:hover {
        background: var(--surface-container-high);
        transform: translateY(-1px);
      }

      .variation-btn:active {
        transform: scale(0.92);
      }

      .variation-btn.active {
        background: var(--primary-gradient);
        color: var(--on-primary);
        border-color: var(--primary);
        box-shadow: var(--shadow-xs);
      }

      .menu-card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: var(--space-xs);
        gap: var(--space-xs);
        flex-wrap: wrap;
      }

      .menu-card-price {
        font-size: 14px;
        font-weight: 800;
        color: var(--on-secondary);
        background: var(--secondary-gradient);
        padding: 2px var(--space-md);
        border-radius: var(--radius-full);
        display: inline-flex;
        align-items: center;
        gap: var(--space-xs);
        box-shadow: var(--shadow-xs);
        letter-spacing: 0.02em;
      }

      .menu-card-price::before {
        content: "ج.م";
        font-weight: 500;
        font-size: 10px;
        opacity: 0.8;
      }

      .menu-card-actions {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
      }

      .qty-btn {
        width: 28px;
        height: 28px;
        border-radius: var(--radius-full);
        background: var(--surface-container);
        color: var(--on-surface);
        font-size: 16px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all var(--duration-fast) var(--ease-out);
        border: 1px solid transparent;
        user-select: none;
        line-height: 1;
      }

      .qty-btn:hover {
        background: var(--surface-container-high);
        transform: translateY(-1px);
      }

      .qty-btn:active {
        transform: scale(0.84);
      }

      .qty-btn.add {
        background: var(--primary-gradient);
        color: var(--on-primary);
        width: 32px;
        height: 32px;
        font-size: 18px;
        box-shadow: var(--shadow-xs);
      }

      .qty-btn.add:hover {
        box-shadow: var(--shadow-sm);
        transform: translateY(-1px) scale(1.04);
      }

      .qty-btn.add.in-cart {
        background: var(--secondary-gradient);
      }

      .qty-value {
        font-size: 14px;
        font-weight: 800;
        min-width: 20px;
        text-align: center;
        color: var(--on-surface);
      }

      .qty-controls {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        background: var(--surface-container);
        border-radius: var(--radius-full);
        padding: 2px 4px;
      }

      .qty-controls .qty-btn {
        width: 24px;
        height: 24px;
        font-size: 14px;
        background: transparent;
      }

      .qty-controls .qty-btn:hover {
        background: var(--surface-container-high);
      }

      .qty-controls .qty-value {
        font-size: 13px;
        min-width: 16px;
      }

      /* ============================================================
               MODALS
               ============================================================ */
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(44, 31, 22, 0.5);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity var(--duration-med) var(--ease-out),
          visibility var(--duration-med) var(--ease-out);
      }

      .modal-overlay.open {
        opacity: 1;
        visibility: visible;
      }

      .modal-overlay.open .modal-content {
        transform: translateY(0);
      }

      .modal-content {
        background: var(--surface-container-lowest);
        border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
        max-width: 600px;
        width: 100%;
        max-height: 92vh;
        display: flex;
        flex-direction: column;
        transform: translateY(100%);
        transition: transform var(--duration-slow) var(--ease-spring);
        box-shadow: var(--shadow-xl);
        overflow: hidden;
        position: relative;
      }

      .modal-content::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--primary-gradient);
        border-radius: 0 0 3px 3px;
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-lg) var(--space-lg) var(--space-sm);
        border-bottom: 1px solid var(--outline-variant);
        flex-shrink: 0;
        background: var(--surface-container-low);
        border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
      }

      .modal-header h2 {
        font: var(--headline-md);
        color: var(--on-surface);
        display: flex;
        align-items: center;
        gap: var(--space-sm);
      }

      .modal-header h2 i {
        color: var(--primary);
        font-size: 22px;
      }

      .modal-header h2 .count {
        font-size: 13px;
        font-weight: 700;
        background: var(--surface-container);
        padding: 0 var(--space-md);
        border-radius: var(--radius-full);
        color: var(--on-surface-variant);
        min-width: 28px;
        text-align: center;
      }

      .modal-close {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-full);
        background: var(--surface-container);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        transition: all var(--duration-fast) var(--ease-out);
        color: var(--on-surface-variant);
        border: 1px solid transparent;
      }

      .modal-close:hover {
        background: var(--surface-container-high);
        transform: rotate(90deg) scale(1.05);
      }

      .modal-close:active {
        transform: scale(0.88);
      }

      .modal-body {
        flex: 1;
        overflow-y: auto;
        padding: var(--space-md) var(--space-lg);
        -webkit-overflow-scrolling: touch;
      }

      .modal-footer {
        padding: var(--space-md) var(--space-lg);
        border-top: 1px solid var(--outline-variant);
        flex-shrink: 0;
        background: var(--surface-container-low);
        border-radius: 0 0 var(--radius-2xl) var(--radius-2xl);
      }

      /* ============================================================
               CHOICE MODAL
               ============================================================ */
      .choice-modal-content {
        max-width: 520px;
        border-radius: var(--radius-2xl);
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: var(--space-2xl) var(--space-xl);
        background: var(--surface-container-lowest);
        transform: scale(0.92) translateY(20px);
        transition:
          transform var(--duration-slow) var(--ease-spring),
          opacity var(--duration-med) var(--ease-out);
      }

      .modal-overlay.open .choice-modal-content {
        transform: scale(1) translateY(0);
      }

      .choice-header h2 {
        font: var(--headline-lg);
        color: var(--on-surface);
        margin-bottom: var(--space-xs);
      }

      .choice-header p {
        font: var(--body-lg);
        color: var(--on-surface-variant);
        opacity: 0.8;
        margin-bottom: var(--space-2xl);
      }

      .choice-options {
        display: flex;
        flex-direction: column;
        gap: var(--space-lg);
        width: 100%;
      }

      .choice-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-md);
        padding: var(--space-lg) var(--space-xl);
        border-radius: var(--radius-xl);
        border: 2px solid var(--outline-variant);
        background: var(--surface-container-low);
        transition: all var(--duration-fast) var(--ease-out);
        font-size: 20px;
        font-weight: 700;
        color: var(--on-surface);
        cursor: pointer;
        width: 100%;
        text-align: right;
      }

      .choice-btn i {
        font-size: 32px;
        color: var(--primary);
        width: 48px;
        text-align: center;
      }

      .choice-btn:hover {
        border-color: var(--primary);
        background: var(--surface-container);
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }

      .choice-btn:active {
        transform: scale(0.96);
      }

      .choice-btn .btn-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-xs);
      }

      .choice-btn .btn-text small {
        font-size: 14px;
        font-weight: 400;
        color: var(--on-surface-variant);
        opacity: 0.7;
      }

      .choice-btn.delivery-btn i {
        color: var(--secondary);
      }

      .choice-btn.dinein-btn i {
        color: var(--primary);
      }

      @media (min-width: 600px) {
        .choice-options {
          flex-direction: row;
        }
        .choice-btn {
          flex: 1;
        }
        .modal-overlay {
          align-items: center;
        }
        .choice-modal-content {
          border-radius: var(--radius-2xl);
        }
      }

      /* ============================================================
               CART EMPTY
               ============================================================ */
      .cart-empty {
        text-align: center;
        padding: var(--space-3xl) var(--space-lg);
        color: var(--on-surface-variant);
      }

      .cart-empty i {
        font-size: 48px;
        margin-bottom: var(--space-md);
        opacity: 0.3;
        display: block;
        color: var(--on-surface-variant);
      }

      .cart-empty h3 {
        font: var(--headline-md);
        color: var(--on-surface);
        margin-bottom: var(--space-xs);
      }

      .cart-empty p {
        color: var(--on-surface-variant);
        opacity: 0.7;
        font: var(--body-md);
      }

      /* ============================================================
               CART ITEMS
               ============================================================ */
      .cart-item {
        display: flex;
        gap: var(--space-md);
        padding: var(--space-md) 0;
        border-bottom: 1px solid var(--outline-variant);
        align-items: center;
        animation: cardFadeIn 0.3s var(--ease-spring) forwards;
        transition: background var(--duration-fast) var(--ease-out);
        border-radius: var(--radius-md);
        padding-left: var(--space-sm);
        padding-right: var(--space-sm);
      }

      .cart-item:hover {
        background: var(--surface-container-low);
      }

      .cart-item:last-child {
        border-bottom: none;
      }

      .cart-item-image {
        width: 48px;
        height: 48px;
        border-radius: var(--radius-md);
        object-fit: cover;
        background: var(--surface-container);
        flex-shrink: 0;
        box-shadow: var(--shadow-xs);
      }

      .cart-item-info {
        flex: 1;
        min-width: 0;
      }

      .cart-item-name {
        font: var(--title-md);
        color: var(--on-surface);
        line-height: 1.2;
      }

      .cart-item-price {
        font: var(--body-sm);
        color: var(--on-surface-variant);
        opacity: 0.7;
      }

      .cart-item-controls {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        flex-shrink: 0;
      }

      .cart-item-controls .qty-btn {
        width: 24px;
        height: 24px;
        font-size: 14px;
        background: var(--surface-container);
      }

      .cart-item-controls .qty-btn:hover {
        background: var(--surface-container-high);
      }

      .cart-item-controls .qty-value {
        font-size: 13px;
        min-width: 18px;
        font-weight: 700;
      }

      .cart-item-remove {
        color: var(--error);
        font-size: 14px;
        padding: var(--space-xs);
        border-radius: var(--radius-full);
        transition: all var(--duration-fast) var(--ease-out);
        background: transparent;
        margin-right: var(--space-xs);
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .cart-item-remove:hover {
        background: var(--error-container);
        transform: scale(1.1);
      }

      .cart-item-remove:active {
        transform: scale(0.84);
      }

      /* ============================================================
               CART SUMMARY
               ============================================================ */
      .cart-summary {
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
        margin-bottom: var(--space-md);
      }

      .cart-summary-row {
        display: flex;
        justify-content: space-between;
        font: var(--body-md);
        color: var(--on-surface-variant);
      }

      .cart-summary-row.total {
        font: var(--headline-md);
        font-weight: 800;
        color: var(--on-surface);
        border-top: 2px solid var(--outline-variant);
        padding-top: var(--space-md);
        margin-top: var(--space-xs);
      }

      .cart-summary-row.total .amount {
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .cart-actions {
        display: flex;
        gap: var(--space-sm);
      }

      .cart-actions .btn {
        flex: 1;
        padding: var(--space-md) var(--space-lg);
        border-radius: var(--radius-full);
        font-size: 14px;
        font-weight: 700;
        text-align: center;
        transition: all var(--duration-fast) var(--ease-out);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-sm);
        min-height: 46px;
        letter-spacing: 0.02em;
      }

      .btn-primary {
        background: var(--primary-gradient);
        color: var(--on-primary);
        box-shadow: var(--shadow-sm);
      }

      .btn-primary:hover {
        box-shadow: var(--shadow-md);
        transform: translateY(-2px);
      }

      .btn-primary:active {
        transform: scale(0.96);
      }

      .btn-secondary {
        background: var(--surface-container);
        color: var(--on-surface);
      }

      .btn-secondary:hover {
        background: var(--surface-container-high);
        transform: translateY(-2px);
      }

      .btn-secondary:active {
        transform: scale(0.96);
      }

      .btn-danger {
        background: var(--error-container);
        color: var(--on-error-container);
      }

      .btn-danger:hover {
        background: var(--error);
        color: var(--on-error);
        transform: translateY(-2px);
      }

      .btn-danger:active {
        transform: scale(0.96);
      }

      /* ============================================================
               CHECKOUT FORM
               ============================================================ */
      .checkout-form {
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
        padding: var(--space-sm) 0;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: var(--space-xs);
      }

      .form-group label {
        font: var(--label-md);
        color: var(--on-surface-variant);
        font-weight: 700;
      }

      .form-group input,
      .form-group textarea,
      .form-group select {
        padding: var(--space-md) var(--space-lg);
        border-radius: var(--radius-md);
        border: 1.5px solid var(--outline-variant);
        background: var(--surface-container-lowest);
        font: var(--body-md);
        color: var(--on-surface);
        transition:
          border-color var(--duration-fast) var(--ease-out),
          box-shadow var(--duration-fast) var(--ease-out);
        width: 100%;
        font-family: var(--font-body);
        appearance: auto;
      }

      .form-group input:focus,
      .form-group textarea:focus,
      .form-group select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(166, 28, 44, 0.08);
        outline: none;
      }

      .form-group textarea {
        resize: vertical;
        min-height: 60px;
      }

      .form-group .error-text {
        font: var(--label-sm);
        color: var(--error);
        display: none;
      }

      .form-group.invalid input,
      .form-group.invalid textarea,
      .form-group.invalid select {
        border-color: var(--error);
      }

      .form-group.invalid .error-text {
        display: block;
      }

      .checkout-summary {
        background: var(--surface-container);
        border-radius: var(--radius-lg);
        padding: var(--space-md) var(--space-lg);
        display: flex;
        flex-direction: column;
        gap: var(--space-xs);
      }

      .checkout-summary .row {
        display: flex;
        justify-content: space-between;
        font: var(--body-md);
        color: var(--on-surface-variant);
      }

      .checkout-summary .row.total {
        font: var(--headline-md);
        font-weight: 800;
        color: var(--on-surface);
        border-top: 2px solid var(--outline-variant);
        padding-top: var(--space-md);
        margin-top: var(--space-xs);
      }

      .checkout-summary .row.total .amount {
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* ============================================================
               BRANCHES
               ============================================================ */
      .branches-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--space-md);
        padding: var(--space-xs) 0;
      }

      .branch-card {
        display: flex;
        gap: var(--space-md);
        padding: var(--space-md) var(--space-lg);
        background: var(--surface-container);
        border-radius: var(--radius-lg);
        align-items: center;
        transition: all var(--duration-fast) var(--ease-out);
        border: 1px solid transparent;
        flex-wrap: wrap;
      }

      .branch-card:hover {
        background: var(--surface-container-high);
        border-color: var(--outline-variant);
        transform: translateX(-3px);
        box-shadow: var(--shadow-sm);
      }

      .branch-icon {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-full);
        background: var(--secondary-gradient);
        color: var(--on-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
        box-shadow: var(--shadow-xs);
      }

      .branch-info {
        flex: 1;
        min-width: 0;
      }

      .branch-name {
        font: var(--title-md);
        color: var(--on-surface);
      }

      .branch-address {
        font: var(--body-sm);
        color: var(--on-surface-variant);
        opacity: 0.7;
      }

      .branch-phone {
        font-size: 13px;
        color: var(--on-surface-variant);
        margin-top: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .branch-phone i {
        font-size: 12px;
        color: var(--secondary);
      }

      .branch-map-btn {
        padding: var(--space-xs) var(--space-lg);
        border-radius: var(--radius-full);
        background: var(--primary-gradient);
        color: var(--on-primary);
        font-size: 12px;
        font-weight: 700;
        transition: all var(--duration-fast) var(--ease-out);
        flex-shrink: 0;
        white-space: nowrap;
        box-shadow: var(--shadow-xs);
        letter-spacing: 0.02em;
      }

      .branch-map-btn:hover {
        box-shadow: var(--shadow-md);
        transform: translateY(-1px) scale(1.04);
      }

      .branch-map-btn:active {
        transform: scale(0.94);
      }

      /* ============================================================
               FOOTER
               ============================================================ */
      .footer {
        margin-top: var(--space-3xl);
        padding: var(--space-lg) var(--container-margin);
        border-top: 1px solid var(--outline-variant);
        text-align: center;
        font: var(--body-sm);
        color: var(--on-surface-variant);
      }

      .footer a {
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-weight: 700;
        text-decoration: none;
        transition: opacity var(--duration-fast);
      }

      .footer a:hover {
        opacity: 0.7;
      }

      .footer hr {
        border: none;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--outline-variant),
          transparent
        );
        margin-bottom: var(--space-md);
      }

      /* ============================================================
               RESPONSIVE
               ============================================================ */
      @media (max-width: 359px) {
        .menu-grid {
          grid-template-columns: 1fr;
        }
        .header-brand-name {
          font-size: 15px;
        }
        .header-logo {
          width: 32px;
          height: 32px;
        }
      }

      @media (min-width: 600px) {
        .menu-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: var(--space-lg);
        }
        .header-brand-name {
          font-size: 22px;
        }
        .header-brand-slogan {
          font-size: 13px;
        }
        .header-logo {
          width: 48px;
          height: 48px;
        }
        .header-btn {
          font-size: 13px;
          padding: var(--space-xs) var(--space-lg);
          min-height: 38px;
        }
        .modal-content {
          border-radius: var(--radius-2xl);
        }
        .branches-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (min-width: 1024px) {
        .menu-grid {
          grid-template-columns: repeat(4, 1fr);
          gap: var(--space-xl);
        }
        .header-brand-name {
          font-size: 26px;
        }
        .header-brand-slogan {
          font-size: 14px;
        }
        .header-logo {
          width: 54px;
          height: 54px;
        }
        .header-btn {
          font-size: 14px;
          padding: var(--space-sm) var(--space-xl);
          min-height: 42px;
        }
        .container {
          padding: 0 var(--space-2xl);
        }
        .category-nav-inner {
          justify-content: center;
          gap: var(--space-md);
        }
        .category-chip {
          font-size: 14px;
          padding: var(--space-sm) var(--space-xl);
          min-height: 40px;
        }
        .modal-content {
          max-width: 640px;
          border-radius: var(--radius-2xl);
          margin: auto;
          transform: scale(0.94) translateY(16px);
        }
        .modal-overlay.open .modal-content {
          transform: scale(1) translateY(0);
        }
        .modal-overlay {
          align-items: center;
        }
        .branches-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (min-width: 1400px) {
        .menu-grid {
          grid-template-columns: repeat(4, 1fr);
        }
        .container {
          max-width: 1360px;
        }
      }

      /* ============================================================
               REDUCED MOTION
               ============================================================ */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }

        .menu-card {
          opacity: 1;
          transform: none;
        }

        .cart-badge.bump {
          animation: none;
        }

        .modal-content {
          transition: none;
        }

        .modal-overlay {
          transition: none;
        }

        .header-btn:hover {
          transform: none;
        }

        .menu-card:hover {
          transform: none;
        }

        .branch-card:hover {
          transform: none;
        }

        .qty-btn.add:hover {
          transform: none;
        }
      }

      /* ============================================================
               UTILITY
               ============================================================ */
      .shimmer {
        background: linear-gradient(
          90deg,
          var(--surface-container) 25%,
          var(--surface-container-high) 50%,
          var(--surface-container) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }

      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .menu-card-image-wrap img.error {
        object-fit: contain;
        padding: var(--space-md);
        background: var(--surface-container);
      }

      .checkout-modal .modal-content {
        max-width: 520px;
      }

      .checkout-modal .modal-body {
        padding-bottom: var(--space-lg);
      }

      .modal-body::-webkit-scrollbar {
        width: 4px;
      }

      .modal-body::-webkit-scrollbar-track {
        background: transparent;
      }

      .modal-body::-webkit-scrollbar-thumb {
        background: var(--outline-variant);
        border-radius: var(--radius-full);
      }

      .modal-body::-webkit-scrollbar-thumb:hover {
        background: var(--outline);
      }

      @media (max-width: 480px) {
        .header-btn-label {
          display: none;
        }
        .header-btn-branches .header-btn-label {
          display: none;
        }
        .header-btn {
          padding: var(--space-xs) var(--space-sm);
          min-height: 32px;
          font-size: 16px;
        }
        .header-btn-cart {
          padding: var(--space-xs) var(--space-md);
          min-width: 40px;
        }
        .header-brand-slogan {
          display: none;
        }
        .header-brand-name {
          font-size: 16px;
        }
        .menu-card-name {
          font-size: 15px;
        }
        .menu-card-price {
          font-size: 12px;
          padding: 2px var(--space-sm);
        }
        .menu-card-body {
          padding: var(--space-sm);
        }
        .modal-header h2 {
          font-size: 18px;
        }
        .header-logo {
          width: 36px;
          height: 36px;
        }
      }

      @media (max-width: 380px) {
        .header-logo {
          width: 30px;
          height: 30px;
        }
        .header-brand-name {
          font-size: 14px;
        }
        .menu-grid {
          gap: var(--space-sm);
        }
        .category-chip {
          font-size: 11px;
          padding: var(--space-xs) var(--space-md);
          min-height: 30px;
        }
      }

      .menu-card {
        border: 1px solid var(--surface-container);
      }

      .menu-card:hover {
        border-color: var(--outline-variant);
      }

      .branch-card {
        border: 1px solid transparent;
      }

      .branch-card:hover {
        border-color: var(--outline-variant);
      }

      .btn-primary {
        letter-spacing: 0.04em;
      }

      .header-btn-cart {
        letter-spacing: 0.04em;
      }

      .category-chip {
        border: 1px solid var(--outline-variant);
      }

      .category-chip.active {
        border-color: transparent;
      }

      .category-chip i {
        margin-left: 4px;
        margin-right: 4px;
      }

      .header-btn i {
        font-size: 14px;
      }

      .header-btn-cart i {
        font-size: 16px;
      }

      /* --- Dine-in helper --- */
      .field-dinein-only {
        display: none;
      }
      .field-delivery-only {
        display: none;
      }

      body.order-type-dinein .field-dinein-only {
        display: flex;
      }
      body.order-type-dinein .field-delivery-only {
        display: none;
      }

      body.order-type-delivery .field-dinein-only {
        display: none;
      }
      body.order-type-delivery .field-delivery-only {
        display: flex;
      }

      // ─── BUILD MENU DATA ──────────────────────────────────────────────────

      function buildMenuData(items) {
        let result = [];
        let idCounter = 0;
        items.forEach((item) => {
          const baseName = item.name;
          const desc = item.desc || `من تشكيلة ${item.category}`;
          let variations = [];
          const labelMap = {
            small: "صغير",
            regular: "عادي",
            medium: "وسط",
            large: "كبير",
            mozzarella: "موتزريلا",
          };

          const order = ["small", "regular", "medium", "large", "mozzarella"];
          order.forEach((key) => {
            if (item.prices[key] !== undefined) {
              variations.push({
                label: labelMap[key] || key,
                price: item.prices[key],
              });
            }
          });
          if (variations.length === 0) {
            for (const [key, value] of Object.entries(item.prices)) {
              variations.push({ label: key, price: value });
            }
          }
          if (variations.length === 0) {
            variations = [{ label: "عادي", price: 0 }];
          }
          result.push({
            id: `item-${idCounter++}`,
            category: item.category,
            name: baseName,
            desc: desc,
            image:
              item.image ||
              `https://picsum.photos/seed/${encodeURIComponent(baseName)}/400/300`,
            variations: variations,
            defaultVariation: 0,
          });
        });
        return result;
      }

      let MENU_DATA = buildMenuData(MENU_ITEMS);
