                            </div>
                            <div class="cart-actions">
                                <button class="btn btn-danger" id="clearCartBtn"><i class="fas fa-trash-alt"></i> مسح السلة</button>
                                <button class="btn btn-primary" id="checkoutBtn"><i class="fas fa-clipboard-list"></i> إتمام الطلب</button>
                            </div>
                        `;
            },

            bindBodyEvents() {
                this.body.addEventListener('click', (e) => {
                    const btn = e.target.closest('button[data-action]');
                    if (!btn) return;
                    const action = btn.dataset.action;
                    const itemEl = btn.closest('.cart-item');
                    if (!itemEl) return;
                    const id = itemEl.dataset.itemId;
                    if (!id) return;

                    if (action === 'cart-increase') {
                        Cart.updateQuantity(id, 1);
                        App.updateCartUI();
                        this.render();
                        const baseId = id.split('-')[0];
                        if (baseId) { Menu.updateItemQuantity(baseId); }
                    } else if (action === 'cart-decrease') {
                        Cart.updateQuantity(id, -1);
                        App.updateCartUI();
                        this.render();
                        const baseId = id.split('-')[0];
                        if (baseId) { Menu.updateItemQuantity(baseId); }
                    } else if (action === 'cart-remove') {
                        Swal.fire({
                            title: 'إزالة العنصر؟',
                            text: `هل تريد إزالة هذا العنصر من السلة؟`,
                            icon: 'question',
                            showCancelButton: true,
                            confirmButtonColor: '#A61C2C',
                            cancelButtonColor: '#A68B7A',
                            confirmButtonText: 'نعم، إزالة',
                            cancelButtonText: 'إلغاء'
                        }).then(result => {
                            if (result.isConfirmed) {
                                Cart.removeItem(id);
                                App.updateCartUI();
                                this.render();
                                const baseId = id.split('-')[0];
                                if (baseId) { Menu.updateItemQuantity(baseId); }
                            }
                        });
                    }
                });
            },

            bindFooterEvents() {
                this.footer.addEventListener('click', (e) => {
                    if (e.target.closest('#continueShoppingBtn')) {
                        this.close();
                        return;
                    }
                    if (e.target.closest('#clearCartBtn')) {
                        Swal.fire({
                            title: 'مسح السلة؟',
                            text: 'سيتم حذف جميع العناصر من السلة',
                            icon: 'warning',
                            showCancelButton: true,
                            confirmButtonColor: '#A61C2C',
                            cancelButtonColor: '#A68B7A',
                            confirmButtonText: 'نعم، مسح الكل',
                            cancelButtonText: 'إلغاء'
                        }).then(result => {
                            if (result.isConfirmed) {
                                Cart.clear();
                                App.updateCartUI();
                                this.render();
                                Menu.renderItems(Menu.currentCategory);
                                Swal.fire('تم المسح', 'تم إفراغ السلة بنجاح', 'success');
                            }
                        });
                        return;
                    }
                    if (e.target.closest('#checkoutBtn')) {
                        this.close();
                        CheckoutUI.open();
                    }
                });
            }
        };

        // ─── CHECKOUT UI ────────────────────────────────────────────────────

        const CheckoutUI = {
            modal: null,
            body: null,
            isOpen: false,
            DELIVERY_WHATSAPP: '201013706142',
            DINEIN_WHATSAPP: '201060524239',

            init() {
                this.modal = document.getElementById('checkoutModal');
                this.body = document.getElementById('checkoutModalBody');
                document.getElementById('checkoutModalClose').addEventListener('click', () => this.close());
                this.modal.addEventListener('click', (e) => { if (e.target === this.modal) this.close(); });
                document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && this.isOpen) this.close(); });
                return this;
            },

            open() {
                this.isOpen = true;
                this.modal.classList.add('open');
                document.body.style.overflow = 'hidden';
                this.render();
                document.getElementById('checkoutModalClose').focus();

            close() {
                this.isOpen = false;
                this.modal.classList.remove('open');
                document.body.style.overflow = '';

            render() {
                const items = Cart.getItems();
                const totalItems = Cart.getTotalItems();
                const totalPrice = Cart.getTotalPrice();
                const isDineIn = orderType === 'dinein';

                    this.body.innerHTML =
                        `<div class="cart-empty"><i class="fas fa-clipboard-list"></i><h3>السلة فارغة</h3><p>أضف أطباقك المفضلة أولاً</p><button class="btn btn-primary" id="backToCartBtn" style="margin-top:var(--space-md);">العودة للسلة</button></div>`;
                    const backBtn = document.getElementById('backToCartBtn');

                            CartUI.open(); }); }
                    return;
                }

                const branchOptions = BRANCHES.map(b => `<option value="${b.id}">${b.name}</option>`).join('');

                });

                // ─── Build the form conditionally ──────────────────────────

                let formHtml = `<form class="checkout-form" id="checkoutForm" novalidate>`;

                // ── DINE-IN FIELDS ──
                if (isDineIn) {
                    formHtml += `
                                <div class="form-group" id="tableGroup">

                                    <span class="error-text">الرجاء إدخال رقم التابل</span>

                                <div class="form-group" id="nameGroup">

                                    <span class="error-text">الرجاء إدخال الاسم</span>

                } else {

                    formHtml += `
                                <div class="form-group" id="branchGroup">
                                    <label for="customerBranch">اختر الفرع *</label>
                                    <select id="customerBranch" required>
                                        <option value="">-- اختر فرع --</option>
                                        ${branchOptions}

                                    <span class="error-text">الرجاء اختيار فرع</span>
                                </div>
                                <div class="form-group" id="nameGroup">
                                    <label for="customerName">الاسم الكامل *</label>
                                    <input type="text" id="customerName" placeholder="أدخل اسمك الكامل" required aria-required="true" autocomplete="name" />
                                    <span class="error-text">الرجاء إدخال الاسم</span>

                                <div class="form-group" id="phoneGroup">

                // ── ORDER SUMMARY ── (same for both)
                formHtml += `

                                <div style="font-size:13px;color:var(--on-surface-variant);opacity:0.7;margin-top:var(--space-xs);">عدد العناصر: ${totalItems}</div>
                            </div>
                            <button type="submit" class="btn btn-primary" style="width:100%;padding:var(--space-lg);font-size:16px;"><i class="fab fa-whatsapp"></i> أطلب عبر واتساب</button>
                        </form>`;

                this.body.innerHTML = formHtml;

                // ─── Bind form submit ──────────────────────────────────────
                const form = document.getElementById('checkoutForm');
                form.addEventListener('submit', (e) => { e.preventDefault();
                    this.handleSubmit(); });

                // ─── Bind validation events ────────────────────────────────
                const fields = isDineIn ?
                    ['tableNumber', 'customerName'] :
                    ['customerBranch', 'customerName', 'customerPhone', 'customerAddress'];

                fields.forEach(id => {
                    const input = document.getElementById(id);
                    if (!input) return;
                    const blurHandler = () => {
                        const group = input.closest('.form-group');
                        if (group) {

                    input.addEventListener('blur', blurHandler);

                    });

                // Auto-focus first field

            handleSubmit() {
                const isDineIn = orderType === 'dinein';

                // ─── Gather values ─────────────────────────────────────────
                let branch = '';
                let branchName = '';
                let name = '';
                let phone = '';
                let address = '';
                let notes = '';
                let table = '';

                if (isDineIn) {
                    table = document.getElementById('tableNumber').value.trim();
                    name = document.getElementById('customerName').value.trim();
                } else {
                    branch = document.getElementById('customerBranch').value;
                    branchName = BRANCHES.find(b => b.id === branch)?.name || '';
                    name = document.getElementById('customerName').value.trim();
                    phone = document.getElementById('customerPhone').value.trim();
                    address = document.getElementById('customerAddress').value.trim();
                    notes = document.getElementById('customerNotes').value.trim();
                }

                // ─── Validate ──────────────────────────────────────────────
                let valid = true;

                if (isDineIn) {
                    const tableGroup = document.getElementById('tableGroup');
                    const nameGroup = document.getElementById('nameGroup');
                    if (!table) { tableGroup.classList.add('invalid');
                        valid = false; } else { tableGroup.classList.remove('invalid'); }
                    if (!name) { nameGroup.classList.add('invalid');
                        valid = false; } else { nameGroup.classList.remove('invalid'); }
                } else {
                    const branchGroup = document.getElementById('branchGroup');
                    const nameGroup = document.getElementById('nameGroup');
                    const phoneGroup = document.getElementById('phoneGroup');
                    const addressGroup = document.getElementById('addressGroup');

                    if (!branch) { branchGroup.classList.add('invalid');
                        valid = false; } else { branchGroup.classList.remove('invalid'); }
                    if (!name) { nameGroup.classList.add('invalid');
                        valid = false; } else { nameGroup.classList.remove('invalid'); }
                    if (!phone || phone.length < 10) { phoneGroup.classList.add('invalid');
                        valid = false; } else { phoneGroup.classList.remove('invalid'); }
                    if (!address) { addressGroup.classList.add('invalid');
                        valid = false; } else { addressGroup.classList.remove('invalid'); }
                }

                if (!valid) {
                    Swal.fire({
                        title: 'بيانات ناقصة',
                        text: 'الرجاء ملء جميع الحقول المطلوبة',
                        icon: 'error',
                        confirmButtonColor: '#A61C2C'
                    });
                    return;
                }

                // ─── Build WhatsApp message ────────────────────────────────
                const items = Cart.getItems();
                const orderTypeLabel = isDineIn ? 'صالة' : 'دليفري';

                let orderText = `🍽️ *طلب جديد من كشري الزهراء*%0A%0A`;
                orderText += `📋 *نوع الطلب:* ${orderTypeLabel}%0A`;

                if (isDineIn) {
                    // Dine-in: use first branch as default (since we don't ask)
                    const defaultBranch = BRANCHES[0];
                    orderText += `📍 *الفرع:* ${encodeURIComponent(defaultBranch.name)}%0A`;
                    orderText += `🪑 *رقم التابل:* ${encodeURIComponent(table)}%0A`;
                    orderText += `👤 *الاسم:* ${encodeURIComponent(name)}%0A`;
                } else {
                    orderText += `📍 *الفرع:* ${encodeURIComponent(branchName)}%0A`;
                    orderText += `👤 *الاسم:* ${encodeURIComponent(name)}%0A`;
                    orderText += `📱 *الهاتف:* ${encodeURIComponent(phone)}%0A`;
                    orderText += `📍 *العنوان:* ${encodeURIComponent(address)}%0A`;
                    if (notes) orderText += `📝 *ملاحظات:* ${encodeURIComponent(notes)}%0A`;
                }

                orderText += `%0A*🧾 الطلب:*%0A`;
                items.forEach((item, i) => {
                    orderText +=
                        `${i+1}. ${encodeURIComponent(item.name)} × ${item.quantity} = ${UI.formatPrice(item.price * item.quantity)}%0A`;
                });
                orderText += `%0A💰 *المجموع الكلي:* ${UI.formatPrice(Cart.getTotalPrice())}%0A`;
                orderText += `%0A🙏 *شكراً لتسوقكم مع كشري الزهراء!*`;

                // ─── Choose WhatsApp number ────────────────────────────────
                const whatsappNumber = isDineIn ? this.DINEIN_WHATSAPP : this.DELIVERY_WHATSAPP;
                const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${orderText}`;

                Swal.fire({
                    title: '✅ تم إتمام الطلب!',
                    text: `سيتم تحويلك إلى واتساب المطعم (${orderTypeLabel}) لإرسال الطلب`,
                    icon: 'success',
                    confirmButtonColor: '#A61C2C',
                    confirmButtonText: '📱 أرسل الطلب',
                    showCancelButton: true,
                    cancelButtonText: 'إلغاء'
                }).then(result => {
                    if (result.isConfirmed) {
                        Cart.clear();
                        App.updateCartUI();
                        Menu.renderItems(Menu.currentCategory);
                        this.close();
                        window.open(whatsappUrl, '_blank');
                        Swal.fire({
                            title: 'شكراً لك!',
                            text: 'تم إرسال طلبك إلى كشري الزهراء. سنتواصل معك قريباً.',
                            icon: 'success',
                            confirmButtonColor: '#A61C2C'
                        });
                    }
                });
            }
        };

        // ─── BRANCHES UI ────────────────────────────────────────────────────

        const BranchesUI = {
            modal: null,
            body: null,
            isOpen: false,

            init() {
                this.modal = document.getElementById('branchesModal');
                this.body = document.getElementById('branchesModalBody');
                document.getElementById('branchesModalClose').addEventListener('click', () => this.close());
                this.modal.addEventListener('click', (e) => { if (e.target === this.modal) this.close(); });
                document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && this.isOpen) this.close(); });
                document.getElementById('branchesBtn').addEventListener('click', () => this.open());
                return this;
            },

            open() {
                this.isOpen = true;
                this.modal.classList.add('open');
                document.body.style.overflow = 'hidden';
                this.render();
                document.getElementById('branchesModalClose').focus();
            },

            close() {
                this.isOpen = false;
                this.modal.classList.remove('open');
                document.body.style.overflow = '';
            },

            render() {
                this.body.innerHTML = `
                            <div class="branches-grid">
                                ${BRANCHES.map(branch => `
                                    <div class="branch-card">
                                        <div class="branch-icon"><i class="fas fa-store"></i></div>
                                        <div class="branch-info">
                                            <div class="branch-name">${branch.name}</div>
                                            <div class="branch-address">${branch.address}</div>
                                            <div class="branch-phone">
                                                <i class="fas fa-phone-alt"></i>
                                                <span>${BRANCH_PHONES}</span>
                                            </div>
                                        </div>
                                        <a href="${branch.mapUrl}" target="_blank" rel="noopener noreferrer" class="branch-map-btn" aria-label="فتح الموقع على خرائط جوجل"><i class="fas fa-map-marked-alt"></i> خريطة</a>
                                    </div>
                                `).join('')}
                            </div>
                        `;
            }
        };

        // ─── CHOICE UI ──────────────────────────────────────────────────────

        const ChoiceUI = {
            modal: null,
            isOpen: false,

            init() {
                this.modal = document.getElementById('choiceModal');
                document.getElementById('deliveryChoice').addEventListener('click', () => {
                    orderType = 'delivery';
                    document.body.classList.add('order-type-delivery');
                    document.body.classList.remove('order-type-dinein');
                    this.close();
                    App.startApp();
                });
                document.getElementById('dineinChoice').addEventListener('click', () => {
                    orderType = 'dinein';
                    document.body.classList.add('order-type-dinein');
                    document.body.classList.remove('order-type-delivery');
                    this.close();
                    App.startApp();
                });
                this.modal.addEventListener('click', (e) => { if (e.target === this.modal) return; });
                document.addEventListener('keydown', (e) => { if (e.key === 'Escape') return; });
                return this;
            },

            open() {
                this.isOpen = true;
                this.modal.classList.add('open');
                document.body.style.overflow = 'hidden';
            },

            close() {
                this.isOpen = false;
                this.modal.classList.remove('open');
                document.body.style.overflow = '';
            }
        };

        // ─── APP ────────────────────────────────────────────────────────────

        const App = {
            initialized: false,

            init() {
                ChoiceUI.init();
                ChoiceUI.open();
            },

            startApp() {
                if (this.initialized) return;
                this.initialized = true;

                Cart.init();
                Menu.init();
                CartUI.init();
                CheckoutUI.init();
                BranchesUI.init();

                document.getElementById('cartBtn').addEventListener('click', () => { CartUI.open(); });
                this.updateCartUI();

                const header = document.getElementById('appHeader');
                window.addEventListener('scroll', UI.throttleRAF(() => {
                    if (window.scrollY > 10) { header.classList.add('scrolled'); } else { header.classList.remove(
                            'scrolled'); }
                }));

                const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)');
                if (prefersReduced.matches) {
                    document.querySelectorAll('.menu-card').forEach(el => {
                        el.style.animation = 'none';
                        el.style.opacity = '1';
                        el.style.transform = 'none';
                    });
                }
                console.log('🌿 كشري الزهراء — تم تحميل الموقع بنجاح، نوع الطلب:', orderType);
            },

            updateCartUI() {
                const total = Cart.getTotalItems();
                const badge = document.getElementById('cartBadge');
                const label = document.getElementById('cartLabel');
                if (badge) { badge.textContent = total;
                    badge.style.display = total > 0 ? 'flex' : 'none'; }
                if (label) { label.textContent = total > 0 ? `السلة (${total})` : 'السلة'; }
                const countEl = document.getElementById('cartModalCount');
                if (countEl) countEl.textContent = total;
            }
        };

        document.addEventListener('DOMContentLoaded', () => { App.init(); });

        // Expose for debugging
        window.App = App;
        window.Menu = Menu;
        window.CartUI = CartUI;
        window.CheckoutUI = CheckoutUI;
        window.BranchesUI = BranchesUI;
    </script>
</body>
</html>
